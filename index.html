<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DSA Tracker v8</title>
<style>
:root {
  --bg: #f4f6fa;
  --panel: #ffffff;
  --text: #1a2332;
  --muted: #5b6577;
  --border: #e2e7f0;
  --accent: #2563eb;
  --accent-soft: #dbeafe;
  --good: #059669;
  --good-soft: #d1fae5;
  --warn: #d97706;
  --warn-soft: #fef3c7;
  --danger: #dc2626;
  --danger-soft: #fee2e2;
  --shadow: 0 1px 3px rgba(16,24,40,.08), 0 8px 24px rgba(16,24,40,.06);
  --sidebar-w: 300px;
  --radius: 12px;
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}
html[data-theme="dark"] {
  --bg: #0f1419;
  --panel: #1a222d;
  --text: #e8edf5;
  --muted: #9aa6b8;
  --border: #2a3544;
  --accent: #60a5fa;
  --accent-soft: #1e3a5f;
  --good: #34d399;
  --good-soft: #064e3b;
  --warn: #fbbf24;
  --warn-soft: #78350f;
  --danger: #f87171;
  --danger-soft: #7f1d1d;
  --shadow: 0 1px 3px rgba(0,0,0,.35), 0 8px 24px rgba(0,0,0,.25);
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
  background: var(--bg);
  color: var(--text);
  line-height: 1.45;
  min-height: 100vh;
}
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }
button, input, select {
  font: inherit;
  color: inherit;
}
.app {
  display: grid;
  grid-template-columns: var(--sidebar-w) 1fr;
  grid-template-rows: auto auto 1fr;
  grid-template-areas:
    "header header"
    "progress progress"
    "sidebar main";
  min-height: 100vh;
  gap: 0;
}
.header {
  grid-area: header;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 1rem;
  padding: .85rem 1.25rem;
  background: var(--panel);
  border-bottom: 1px solid var(--border);
  position: sticky;
  top: 0;
  z-index: 30;
}
.brand { display: flex; align-items: baseline; gap: .6rem; }
.brand h1 { font-size: 1.15rem; margin: 0; letter-spacing: -.02em; }
.brand span { color: var(--muted); font-size: .85rem; }
.header-actions { display: flex; align-items: center; gap: .5rem; flex-wrap: wrap; }
.icon-btn, .btn {
  border: 1px solid var(--border);
  background: var(--panel);
  border-radius: 8px;
  padding: .4rem .7rem;
  cursor: pointer;
  transition: background .15s, border-color .15s;
}
.icon-btn:hover, .btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); color: #fff; border-color: transparent; }
html[data-theme="dark"] .btn.primary { color: #0b1220; }
.btn.danger { background: var(--danger-soft); color: var(--danger); border-color: transparent; }
.progress-wrap {
  grid-area: progress;
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: .75rem;
  padding: .9rem 1.25rem;
  background: var(--panel);
  border-bottom: 1px solid var(--border);
}
.pbar {
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: .65rem .75rem;
}
.pbar .label { display: flex; justify-content: space-between; font-size: .78rem; color: var(--muted); margin-bottom: .35rem; }
.pbar .label b { color: var(--text); font-weight: 600; }
.track { height: 8px; background: var(--border); border-radius: 99px; overflow: hidden; }
.fill { height: 100%; background: linear-gradient(90deg, var(--accent), #7c3aed); border-radius: 99px; width: 0; transition: width .25s ease; }
.pbar.phase1 .fill { background: linear-gradient(90deg, #0ea5e9, #2563eb); }
.pbar.phase2 .fill { background: linear-gradient(90deg, #10b981, #059669); }
.pbar.revs .fill { background: linear-gradient(90deg, #f59e0b, #d97706); }
.pbar.core .fill { background: linear-gradient(90deg, #a855f7, #7c3aed); }
.sidebar {
  grid-area: sidebar;
  border-right: 1px solid var(--border);
  background: var(--panel);
  padding: .35rem .55rem .6rem;
  overflow: auto;
  max-height: calc(100vh - 3.2rem);
  position: sticky;
  top: 3.15rem;
  align-self: start;
}
.sidebar h3 {
  margin: 0;
  font-size: .72rem;
  text-transform: uppercase;
  letter-spacing: .04em;
  color: var(--muted);
  white-space: nowrap;
}
.pat {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: .4rem;
  width: 100%;
  text-align: left;
  border: 1px solid transparent;
  background: transparent;
  border-radius: 8px;
  padding: .32rem .4rem;
  cursor: pointer;
  margin-bottom: 1px;
}
.pat:hover { background: var(--bg); }
.pat.active { background: var(--accent-soft); border-color: var(--accent); }
.pat .n {
  display: flex;
  align-items: center;
  min-width: 0;
  flex: 1;
  font-size: .84rem;
  line-height: 1.2;
}
.pat .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pat .c { flex: none; font-size: .72rem; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
.main {
  grid-area: main;
  padding: .85rem 1.25rem 2.5rem;
  min-width: 0;
}
.tabs {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: .4rem;
  min-height: 2.15rem;
  margin: 0 0 .85rem;
}
.tab {
  border: 1px solid var(--border);
  background: var(--panel);
  border-radius: 999px;
  padding: .4rem .85rem;
  cursor: pointer;
  font-size: .9rem;
}
.tab.active { background: var(--accent); color: #fff; border-color: transparent; }
html[data-theme="dark"] .tab.active { color: #0b1220; }
.toolbar {
  display: flex;
  flex-wrap: wrap;
  gap: .5rem;
  margin-bottom: .85rem;
  align-items: center;
}
.toolbar input[type="search"], .toolbar select, .settings input[type="date"], .settings input[type="number"] {
  border: 1px solid var(--border);
  background: var(--panel);
  border-radius: 8px;
  padding: .45rem .65rem;
  min-width: 0;
}
.toolbar input[type="search"] { flex: 1; min-width: 180px; }
.meta-line {
  color: var(--muted);
  font-size: .85rem;
  margin: 0 0 .75rem;
}
.section {
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  margin-bottom: 1rem;
  overflow: hidden;
}
.section h2 {
  margin: 0;
  padding: .7rem 1rem;
  font-size: .95rem;
  border-bottom: 1px solid var(--border);
  background: var(--bg);
  display: flex;
  justify-content: space-between;
  gap: .5rem;
}
.section h2 .badge {
  font-size: .75rem;
  font-weight: 600;
  color: var(--muted);
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 999px;
  padding: .1rem .5rem;
}
.row {
  display: grid;
  grid-template-columns: auto 1fr auto auto;
  gap: .65rem;
  align-items: center;
  padding: .55rem .9rem;
  border-bottom: 1px solid var(--border);
}
.row:last-child { border-bottom: none; }
.row:hover { background: var(--bg); }
.row.done .qname { color: var(--muted); text-decoration: line-through; }
.row input[type="checkbox"] { width: 1.1rem; height: 1.1rem; cursor: pointer; accent-color: var(--accent); }
.qname { font-weight: 550; font-size: .92rem; }
.qmeta { display: flex; flex-wrap: wrap; gap: .35rem; margin-top: .2rem; }
.chip {
  font-size: .7rem;
  color: var(--muted);
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 999px;
  padding: .08rem .45rem;
}
.chip.rev { color: var(--warn); background: var(--warn-soft); border-color: transparent; }
.chip.over { color: var(--danger); background: var(--danger-soft); border-color: transparent; }
.chip.phase { color: var(--accent); background: var(--accent-soft); border-color: transparent; }
.open-link {
  font-size: .82rem;
  font-weight: 600;
  padding: .25rem .55rem;
  border-radius: 6px;
  border: 1px solid var(--border);
  white-space: nowrap;
}
.open-link.disabled { opacity: .45; pointer-events: none; }
.companies { font-size: .78rem; color: var(--muted); max-width: 220px; text-align: right; }
.settings {
  display: grid;
  gap: .85rem;
  max-width: 720px;
}
.settings .card {
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 1rem;
  box-shadow: var(--shadow);
}
.settings label { display: grid; gap: .3rem; font-size: .85rem; color: var(--muted); margin-bottom: .65rem; }
.settings label b { color: var(--text); font-weight: 600; }
.rate-box {
  font-family: var(--mono);
  font-size: .8rem;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: .75rem;
  white-space: pre-wrap;
}
.empty {
  padding: 1.25rem;
  color: var(--muted);
  text-align: center;
}
  .hidden { display: none !important; }
  .app.sidebar-collapsed { grid-template-columns: 0 1fr; }
  .app.sidebar-collapsed .sidebar { display: none; }
  .who { font-size: .8rem; color: var(--muted); max-width: 220px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .idx {
    display: inline-flex; align-items: center; justify-content: center;
    min-width: 1.35rem; height: 1.35rem; margin-right: .35rem;
    border-radius: 999px; background: var(--accent-soft); color: var(--accent);
    font-size: .72rem; font-weight: 700;
  }
  .date-bar {
    display: flex; flex-wrap: wrap; gap: .6rem .85rem; align-items: end;
    background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius);
    padding: .75rem .9rem; margin-bottom: .85rem; box-shadow: var(--shadow);
  }
  .date-bar label { display: grid; gap: .2rem; font-size: .75rem; color: var(--muted); }
  .date-bar label b { color: var(--text); font-weight: 600; }
  .date-bar input[type="date"] {
    border: 1px solid var(--border); background: var(--bg); color: inherit;
    border-radius: 8px; padding: .4rem .5rem;
  }
  .days-pill {
    margin-left: auto; font-weight: 700; font-size: .9rem;
    background: var(--accent-soft); color: var(--accent);
    border-radius: 999px; padding: .35rem .7rem; white-space: nowrap;
  }
  .phase-acc, .accordion {
    background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius);
    box-shadow: var(--shadow); margin-bottom: .85rem; overflow: hidden;
  }
  .phase-acc { border-left: 4px solid #0ea5e9; }
  .phase-acc.phase-2 { border-left-color: #10b981; }
  .phase-acc > summary, .accordion > summary {
    list-style: none; cursor: pointer; display: grid;
    grid-template-columns: auto auto minmax(0, 1fr) auto auto;
    align-items: center; gap: .55rem;
    padding: .75rem .9rem; background: var(--bg); font-weight: 650;
  }
  .phase-acc > summary::-webkit-details-marker, .accordion > summary::-webkit-details-marker { display: none; }
  .phase-acc > summary:hover, .accordion > summary:hover { background: var(--accent-soft); }
  .chev {
    width: .45rem; height: .45rem; border-right: 2px solid var(--muted); border-bottom: 2px solid var(--muted);
    transform: rotate(-45deg); transition: transform .15s ease; margin-right: .15rem;
  }
  .phase-acc[open] > summary .chev, .accordion[open] > summary .chev { transform: rotate(45deg); }
  .acc-name { min-width: 0; }
  .acc-sub { display: block; font-size: .72rem; font-weight: 600; color: var(--muted); margin-top: .12rem; }
  .acc-range { font-size: .75rem; font-weight: 600; color: var(--muted); text-align: right; line-height: 1.35; }
  .acc-check { display: flex; align-items: center; }
  .acc-check input { width: 1.1rem; height: 1.1rem; cursor: pointer; accent-color: var(--good); }
  .mini { width: 64px; height: 5px; border-radius: 99px; background: var(--border); overflow: hidden; justify-self: end; }
  .mini > i { display: block; height: 100%; background: var(--good); width: 0; }
  .phase-body { padding: .7rem .75rem .85rem; display: grid; gap: .55rem; background: color-mix(in srgb, var(--bg) 70%, var(--panel)); }
  .phase-body .accordion { margin: 0; box-shadow: none; }
  .phase-tools { display: flex; justify-content: flex-end; }
  .text-btn {
    border: 0; background: transparent; color: var(--accent); cursor: pointer;
    font-size: .78rem; font-weight: 700; padding: .15rem .2rem;
  }
  .sidebar { position: relative; }
  .side-head { display: flex; align-items: center; gap: .3rem; min-height: 0; margin: 0 0 .2rem; padding: .05rem 1.45rem 0 0; }
  #content.is-in { animation: rise .22s ease; }
  @keyframes rise { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
  .boot-loader {
    position: fixed; inset: 0; z-index: 70;
    display: flex; align-items: center; justify-content: center;
    background: var(--bg); color: var(--muted); font-weight: 650;
    transition: opacity .28s ease;
  }
  .boot-loader.is-done { opacity: 0; pointer-events: none; }
  .toast {
    position: fixed; right: 1rem; bottom: 1rem; z-index: 95;
    width: min(340px, calc(100% - 2rem));
    padding: .75rem 2.2rem .75rem .9rem;
    border-radius: 12px; border: 1px solid transparent;
    box-shadow: var(--shadow);
    opacity: 0; transform: translateY(8px);
    pointer-events: none; transition: opacity .2s ease, transform .2s ease;
  }
  .toast.is-on { opacity: 1; transform: none; pointer-events: auto; }
  .toast.ok { background: var(--good-soft); color: var(--good); border-color: var(--good); }
  .toast.err { background: var(--danger-soft); color: var(--danger); border-color: var(--danger); }
  .toast-x {
    position: absolute; top: .35rem; right: .35rem;
    width: 1.6rem; height: 1.6rem; border: 0; border-radius: 999px;
    background: transparent; color: inherit; cursor: pointer; font-size: 1rem;
  }
  .sidebar .side-head h3 { flex: 1; min-width: 0; margin: 0; overflow: hidden; text-overflow: ellipsis; }
  .side-corner {
    position: absolute; top: .28rem; right: .28rem; z-index: 2;
    width: 1.45rem; height: 1.45rem; padding: 0;
  }
  .side-corner, .side-expand {
    border-radius: 999px; border: 1px solid var(--border);
    background: var(--panel); color: var(--text); cursor: pointer; font-size: .95rem; line-height: 1;
    display: inline-flex; align-items: center; justify-content: center;
  }
  .side-corner:hover, .side-expand:hover { border-color: var(--accent); color: var(--accent); }
  .side-expand {
    display: none; position: fixed; left: .55rem; bottom: 1rem; z-index: 45;
    width: 2.4rem; height: 2.4rem; box-shadow: var(--shadow); font-size: 1.2rem;
  }
  .side-expand.is-on { display: inline-flex; }
  .save-status { font-size: .75rem; color: var(--muted); max-width: 240px; }
  .modal-back {
    position: fixed; inset: 0; z-index: 80;
    background: rgba(15, 23, 42, .48);
    backdrop-filter: blur(6px);
    display: flex; align-items: center; justify-content: center; padding: 1rem;
  }
  .modal {
    width: min(420px, 100%);
    background: var(--panel);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 20px;
    box-shadow: 0 24px 60px rgba(15, 23, 42, .28);
    padding: 1.35rem 1.35rem 1.2rem;
    position: relative;
  }
  .modal-close {
    position: absolute; top: .85rem; right: .85rem;
    width: 2rem; height: 2rem; border-radius: 999px;
    border: 1px solid var(--border); background: var(--bg);
    color: var(--muted); cursor: pointer; font-size: 1.1rem; line-height: 1;
  }
  .modal-close:hover { color: var(--text); border-color: var(--accent); }
  .modal-kicker {
    margin: 0 0 .35rem; font-size: .72rem; font-weight: 700;
    letter-spacing: .08em; text-transform: uppercase; color: var(--accent);
  }
  .modal h2 { margin: 0 0 .4rem; font-size: 1.45rem; letter-spacing: -.03em; }
  .modal .lead { margin: 0 0 1rem; color: var(--muted); font-size: .88rem; line-height: 1.45; }
  .saved-block { margin-bottom: .9rem; }
  .saved-block h3 {
    margin: 0 0 .4rem; font-size: .72rem; font-weight: 700;
    letter-spacing: .05em; text-transform: uppercase; color: var(--muted);
  }
  .saved-list { display: flex; flex-wrap: wrap; gap: .4rem; }
  .saved-list button {
    font-size: .78rem; border-radius: 999px; background: var(--accent-soft);
    border-color: transparent; color: var(--accent); font-weight: 650;
  }
  .saved-list .empty-acc { font-size: .8rem; color: var(--muted); }
  .modal label { display: grid; gap: .35rem; font-size: .8rem; color: var(--muted); margin-bottom: .75rem; }
  .modal label b { color: var(--text); font-size: .84rem; }
  .field {
    display: flex; align-items: center; gap: .35rem;
    border: 1px solid var(--border); background: var(--bg);
    border-radius: 12px; padding: 0 .75rem;
    transition: border-color .15s, box-shadow .15s;
  }
  .field:focus-within { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  .modal input {
    border: 0; background: transparent; border-radius: 0;
    padding: .7rem 0; color: inherit; width: 100%; outline: none;
  }
  .ghost-btn {
    border: 0; background: transparent; color: var(--accent);
    font-weight: 700; font-size: .75rem; cursor: pointer; padding: .2rem 0;
  }
  .file-preview {
    display: flex; justify-content: space-between; gap: .5rem; align-items: center;
    margin: -.15rem 0 .85rem; padding: .55rem .7rem;
    border-radius: 10px; background: var(--bg); border: 1px dashed var(--border);
    font-size: .78rem; color: var(--muted);
  }
  .file-preview b { color: var(--text); font-weight: 650; word-break: break-all; }
  .save-note {
    font-size: .8rem; min-height: 0; margin: 0 0 .75rem;
    padding: .55rem .7rem; border-radius: 10px;
    background: var(--danger-soft); color: var(--danger);
  }
  .save-note:empty { display: none; }
  .modal-actions { display: grid; gap: .45rem; margin-top: .15rem; }
  .modal-actions .btn { width: 100%; padding: .65rem .8rem; border-radius: 12px; font-weight: 700; }
  .modal-actions .btn.primary { box-shadow: 0 8px 18px rgba(37, 99, 235, .25); }
  @media (max-width: 960px) {
  .app {
    grid-template-columns: 1fr;
    grid-template-areas:
      "header"
      "progress"
      "main";
  }
  .sidebar {
    display: none;
    position: fixed;
    inset: 0 auto 0 0;
    width: min(86vw, 300px);
    z-index: 40;
    max-height: none;
    top: 0;
    box-shadow: var(--shadow);
  }
  .sidebar.open { display: block; }
  .progress-wrap { grid-template-columns: 1fr 1fr; }
  .row { grid-template-columns: auto 1fr auto; }
  .companies { grid-column: 2 / -1; text-align: left; max-width: none; margin-top: -.3rem; padding-bottom: .2rem; }
}
@media (max-width: 560px) {
  .progress-wrap { grid-template-columns: 1fr; }
}
</style>
</head>
<body>
<button type="button" class="side-expand" id="sideExpand" title="Show patterns" aria-label="Show patterns">›</button>
<div class="app">
  <header class="header">
    <div class="brand">
      <h1>DSA Tracker</h1>
    </div>
    <div class="header-actions">
      <span class="who" id="who"></span>
      <button class="icon-btn" id="btnAccount" type="button">Sign in</button>
      <button class="icon-btn" id="btnTheme" type="button" title="Toggle theme">Theme</button>
    </div>
  </header>

  <section class="progress-wrap" id="progressBars"></section>

  <aside class="sidebar" id="sidebar"></aside>

  <main class="main">
    <nav class="tabs" id="tabs"></nav>
    <div class="toolbar" id="toolbar"></div>
    <p class="meta-line" id="metaLine"></p>
    <div id="content"></div>
  </main>
</div>

<div class="modal-back hidden" id="accountModal">
  <form class="modal" id="accountForm">
    <button class="modal-close" type="button" id="btnCloseAccount" aria-label="Close">×</button>
    <p class="modal-kicker">Your progress</p>
    <h2>Sign in</h2>
    <p class="lead">Use your mobile number and name. Progress is saved as that pair and restored when you reload.</p>
    <div class="saved-block">
      <h3>Saved accounts</h3>
      <div class="saved-list" id="savedUsers"></div>
    </div>
    <label><b>Mobile number</b><span class="field"><input id="accMobile" inputmode="numeric" autocomplete="username" required pattern="[0-9]{8,15}" placeholder="10-digit mobile"></span></label>
    <label><b>Name</b><span class="field"><input id="accName" autocomplete="name" required maxlength="40" placeholder="Your name"></span></label>
    <label><b>Password</b><span class="field"><input id="accPass" type="password" autocomplete="current-password" required minlength="4" placeholder="At least 4 characters"><button class="ghost-btn" type="button" id="accPassToggle">Show</button></span></label>
    <div class="file-preview"><span>Saved as</span><b id="accFilePreview">mobile_name</b></div>
    <div class="modal-actions">
      <button class="btn primary" type="submit" id="btnLogin">Sign in</button>
      <button class="btn" type="button" id="btnRegister">Create account</button>
    </div>
  </form>
</div>
<div class="boot-loader" id="bootLoader">Loading your progress…</div>

<script>
(function () {
"use strict";

const DATA = JSON.parse(document.getElementById('DATA').textContent);
const STORAGE_KEY = 'dsa_tracker_v8_state';
const SESSION_KEY = 'dsa_tracker_v8_session';
const ACCOUNTS_KEY = 'dsa_tracker_v8_accounts';
// Served by server.mjs: call the API on the same origin (works from any device).
// Opened as a local file: fall back to a server running on this machine.
const API = location.protocol === 'file:' ? 'http://127.0.0.1:8787' : '';
function canReachSaveServer() {
  return true;
}
let serverOk = canReachSaveServer() ? null : false;
const REV_OFFSETS = DATA.revisionOffsets.slice();
const WEEKEND_WEIGHT = 2;
const WEEKDAY_WEIGHT = 1;

const $ = (sel, el=document) => el.querySelector(sel);
const $$ = (sel, el=document) => Array.from(el.querySelectorAll(sel));
const esc = (s) => String(s == null ? '' : s)
  .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');

function parseISO(s) {
  const [y,m,d] = s.split('-').map(Number);
  return new Date(y, m-1, d);
}
function fmtISO(d) {
  const y = d.getFullYear();
  const m = String(d.getMonth()+1).padStart(2,'0');
  const day = String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${day}`;
}
function addDays(d, n) {
  const x = new Date(d.getFullYear(), d.getMonth(), d.getDate());
  x.setDate(x.getDate() + n);
  return x;
}
function daysBetween(a, b) {
  // inclusive count of calendar days from a to b
  const ms = Date.UTC(b.getFullYear(), b.getMonth(), b.getDate()) -
             Date.UTC(a.getFullYear(), a.getMonth(), a.getDate());
  return Math.floor(ms / 86400000) + 1;
}
function eachDate(start, end) {
  const out = [];
  let d = new Date(start.getFullYear(), start.getMonth(), start.getDate());
  const last = new Date(end.getFullYear(), end.getMonth(), end.getDate());
  while (d <= last) {
    out.push(new Date(d.getFullYear(), d.getMonth(), d.getDate()));
    d.setDate(d.getDate() + 1);
  }
  return out;
}
function isWeekend(d) { const w = d.getDay(); return w === 0 || w === 6; }
function weight(d) { return isWeekend(d) ? WEEKEND_WEIGHT : WEEKDAY_WEIGHT; }
function prettyDate(d) {
  return d.toLocaleDateString(undefined, { weekday:'short', day:'numeric', month:'short', year:'numeric' });
}

/** Distribute n items across dates with weekend≈2x weights (Hamilton largest-remainder). */
function allocate(dates, n) {
  if (!dates.length) return dates.map(() => 0);
  const ws = dates.map(weight);
  const totalW = ws.reduce((a,b)=>a+b, 0);
  const exact = ws.map(w => n * w / totalW);
  const base = exact.map(Math.floor);
  let left = n - base.reduce((a,b)=>a+b, 0);
  const order = exact.map((e,i)=>({i, frac: e - base[i]}))
    .sort((a,b) => b.frac - a.frac || a.i - b.i);
  for (let k = 0; k < left; k++) base[order[k % order.length].i] += 1;
  return base;
}

function defaultSettings() {
  const d = DATA.defaults;
  return {
    startDate: d.startDate,
    phase1End: d.phase1End,
    phase2End: d.phase2End,
    revisionDays: d.revisionDays,
    coreDays: 19, // Days 214–232 in v8
  };
}

function loadState() {
  let raw = null;
  try { raw = JSON.parse(localStorage.getItem(STORAGE_KEY) || 'null'); } catch (e) { raw = null; }
  const base = {
    theme: (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light',
    settings: defaultSettings(),
    doneQ: {},      // qid -> true
    doneRev: {},    // `${qid}|${offset}` -> true
    doneCore: {},   // qid -> true (core 200 pass)
    tab: 'today',
    patternFilter: null,
    search: '',
    doneFilter: 'all', // all|done|undone
    sidebarOpen: true,
    openAcc: {},
  };
  if (!raw || typeof raw !== 'object') return base;
  return {
    ...base,
    ...raw,
    settings: { ...base.settings, ...(raw.settings || {}) },
    doneQ: raw.doneQ || {},
    doneRev: raw.doneRev || {},
    doneCore: raw.doneCore || {},
  };
}

let state = loadState();
let lastSavedPayload = '';
let ignoreAccToggle = false;
function progressSnapshot() {
  return JSON.stringify({
    theme: state.theme,
    settings: state.settings,
    doneQ: state.doneQ,
    doneRev: state.doneRev,
    doneCore: state.doneCore,

    patternFilter: state.patternFilter,
    search: state.search,
    doneFilter: state.doneFilter,
    sidebarOpen: state.sidebarOpen !== false,
    openAcc: state.openAcc || {},
  });
}
function saveState() {
  const snap = progressSnapshot();
  if (snap === lastSavedPayload) return;
  lastSavedPayload = snap;
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify({
      theme: state.theme,
      settings: state.settings,
      doneQ: state.doneQ,
      doneRev: state.doneRev,
      doneCore: state.doneCore,
      tab: state.tab,
      patternFilter: state.patternFilter,
      search: state.search,
      doneFilter: state.doneFilter,
      sidebarOpen: state.sidebarOpen !== false,
      openAcc: state.openAcc || {},
    }));
  } catch (e) { /* ignore */ }
  scheduleUserSync();
}

const QBY = Object.fromEntries(DATA.questions.map(q => [q.id, q]));
const CORE_SET = new Set(DATA.core200);

function buildSchedule(settings) {
  const start = parseISO(settings.startDate);
  const p1End = parseISO(settings.phase1End);
  const p2End = parseISO(settings.phase2End);
  const revDaysN = Math.max(0, Number(settings.revisionDays) || 0);
  const coreDaysN = Math.max(1, Number(settings.coreDays) || 19);

  if (!(start <= p1End && p1End < p2End)) {
    return { error: 'Dates must satisfy Start ≤ Phase 1 end < Phase 2 end.', schedule: null };
  }

  const p1Dates = eachDate(start, p1End);
  const p2Dates = eachDate(addDays(p1End, 1), p2End);
  const revStart = addDays(p2End, 1);
  const revDates = revDaysN ? eachDate(revStart, addDays(revStart, revDaysN - 1)) : [];
  const coreStart = revDates.length ? addDays(revDates[revDates.length - 1], 1) : revStart;
  const coreDates = eachDate(coreStart, addDays(coreStart, coreDaysN - 1));

  const p1Qs = DATA.questions.filter(q => q.phase === 1).sort((a,b)=>a.order-b.order);
  const p2Qs = DATA.questions.filter(q => q.phase === 2).sort((a,b)=>a.order-b.order);
  const coreQs = DATA.core200.map(id => QBY[id]);

  const p1Alloc = allocate(p1Dates, p1Qs.length);
  const p2Alloc = allocate(p2Dates, p2Qs.length);
  const coreAlloc = allocate(coreDates, coreQs.length);

  const dayMap = {}; // iso -> {date, phase, newIds:[], coreIds:[], rates}
  function ensure(d, phase) {
    const iso = fmtISO(d);
    if (!dayMap[iso]) dayMap[iso] = { date: d, iso, phase, newIds: [], coreIds: [], nNew: 0, nCore: 0 };
    return dayMap[iso];
  }

  let i = 0;
  p1Dates.forEach((d, idx) => {
    const day = ensure(d, 1);
    day.nNew = p1Alloc[idx];
    for (let k = 0; k < p1Alloc[idx]; k++) day.newIds.push(p1Qs[i++].id);
  });
  i = 0;
  p2Dates.forEach((d, idx) => {
    const day = ensure(d, 2);
    day.nNew = p2Alloc[idx];
    for (let k = 0; k < p2Alloc[idx]; k++) day.newIds.push(p2Qs[i++].id);
  });
  revDates.forEach(d => ensure(d, 3));
  i = 0;
  coreDates.forEach((d, idx) => {
    const day = ensure(d, 4);
    day.nCore = coreAlloc[idx];
    for (let k = 0; k < coreAlloc[idx]; k++) day.coreIds.push(coreQs[i++].id);
  });

  // Assigned date for each question
  const assigned = {}; // qid -> iso
  Object.values(dayMap).forEach(day => {
    day.newIds.forEach(id => { assigned[id] = day.iso; });
  });

  // Revisions: D+1/3/7/21; clamp into revision buffer if after last day of buffer
  // "last day" for clamping = last revision day if any, else phase2End
  const lastClamp = revDates.length ? revDates[revDates.length - 1] : p2End;
  const firstClamp = revDates.length ? revDates[0] : null;
  const revisions = []; // {id, qid, offset, dueIso, clamped}
  const revByDue = {}; // iso -> list

  DATA.questions.forEach(q => {
    const aIso = assigned[q.id];
    if (!aIso) return;
    const aDate = parseISO(aIso);
    REV_OFFSETS.forEach(off => {
      let due = addDays(aDate, off);
      let clamped = false;
      if (due > lastClamp) {
        due = lastClamp;
        clamped = true;
      }
      // If somehow before start of buffer but after p2End and we have buffer, keep as-is on calendar day
      // (normal case: due lands on a real day in p1/p2/rev window)
      const dueIso = fmtISO(due);
      const rec = { id: `${q.id}|${off}`, qid: q.id, offset: off, dueIso, clamped, assignedIso: aIso };
      revisions.push(rec);
      (revByDue[dueIso] || (revByDue[dueIso] = [])).push(rec);
    });
  });

  const allDays = Object.values(dayMap).sort((a,b)=>a.iso < b.iso ? -1 : 1);

  const rates = {
    phase1: {
      days: p1Dates.length,
      questions: p1Qs.length,
      weekdayAvg: avgRate(p1Dates, p1Alloc, false),
      weekendAvg: avgRate(p1Dates, p1Alloc, true),
      min: Math.min(...p1Alloc),
      max: Math.max(...p1Alloc),
      alloc: p1Alloc,
    },
    phase2: {
      days: p2Dates.length,
      questions: p2Qs.length,
      weekdayAvg: avgRate(p2Dates, p2Alloc, false),
      weekendAvg: avgRate(p2Dates, p2Alloc, true),
      min: Math.min(...p2Alloc),
      max: Math.max(...p2Alloc),
    },
    core: {
      days: coreDates.length,
      questions: coreQs.length,
      weekdayAvg: avgRate(coreDates, coreAlloc, false),
      weekendAvg: avgRate(coreDates, coreAlloc, true),
      min: Math.min(...coreAlloc),
      max: Math.max(...coreAlloc),
    },
    revisionDays: revDates.length,
    revisions: revisions.length,
    range: {
      start: fmtISO(start),
      phase1End: fmtISO(p1End),
      phase2End: fmtISO(p2End),
      revStart: revDates.length ? fmtISO(revDates[0]) : null,
      revEnd: revDates.length ? fmtISO(revDates[revDates.length-1]) : null,
      coreStart: fmtISO(coreDates[0]),
      coreEnd: fmtISO(coreDates[coreDates.length-1]),
    }
  };

  return {
    error: null,
    assigned,
    revisions,
    revByDue,
    dayMap,
    allDays,
    rates,
    counts: {
      questions: DATA.questions.length,
      phase1: p1Qs.length,
      phase2: p2Qs.length,
      revisions: revisions.length,
      core: coreQs.length,
    }
  };
}

function avgRate(dates, alloc, weekend) {
  let s = 0, c = 0;
  dates.forEach((d,i) => {
    if (isWeekend(d) === weekend) { s += alloc[i]; c++; }
  });
  return c ? +(s / c).toFixed(2) : 0;
}

let schedule = null;

function recompute() {
  schedule = buildSchedule(state.settings);
}

function applyTheme() {
  document.documentElement.setAttribute('data-theme', state.theme);
}

function progressStats() {
  const p1 = DATA.questions.filter(q => q.phase === 1);
  const p2 = DATA.questions.filter(q => q.phase === 2);
  const doneQ = (arr) => arr.filter(q => state.doneQ[q.id]).length;
  const revDone = schedule ? schedule.revisions.filter(r => state.doneRev[r.id]).length : 0;
  const coreDone = DATA.core200.filter(id => state.doneCore[id]).length;
  return {
    global: { done: doneQ(DATA.questions), total: DATA.questions.length },
    phase1: { done: doneQ(p1), total: p1.length },
    phase2: { done: doneQ(p2), total: p2.length },
    revs: { done: revDone, total: schedule ? schedule.revisions.length : 3148 },
    core: { done: coreDone, total: DATA.core200.length },
  };
}

function renderProgress() {
  const s = progressStats();
  const items = [
    ['Global', s.global, ''],
    ['Phase 1', s.phase1, 'phase1'],
    ['Phase 2', s.phase2, 'phase2'],
    ['Revisions', s.revs, 'revs'],
    ['Core 200', s.core, 'core'],
  ];
  $('#progressBars').innerHTML = items.map(([label, v, cls]) => {
    const pct = v.total ? Math.round(100 * v.done / v.total) : 0;
    return `<div class="pbar ${cls}"><div class="label"><span>${esc(label)}</span><b>${v.done}/${v.total} (${pct}%)</b></div><div class="track"><div class="fill" style="width:${pct}%"></div></div></div>`;
  }).join('');
}

function emptyPatternMap() {
  const map = {};
  DATA.patterns.forEach(p => { map[p.key] = { done: 0, total: 0, name: p.name }; });
  return map;
}
function bumpPattern(map, q, done) {
  if (!q || !map[q.patternKey]) return;
  map[q.patternKey].total++;
  if (done) map[q.patternKey].done++;
}
function patternCounts() {
  const map = emptyPatternMap();
  if (state.tab === 'phase1') {
    DATA.questions.filter(q => q.phase === 1).forEach(q => bumpPattern(map, q, state.doneQ[q.id]));
  } else if (state.tab === 'phase2') {
    DATA.questions.filter(q => q.phase === 2).forEach(q => bumpPattern(map, q, state.doneQ[q.id]));
  } else if (state.tab === 'both') {
    DATA.questions.forEach(q => bumpPattern(map, q, state.doneQ[q.id]));
  } else if (state.tab === 'core') {
    DATA.core200.forEach(id => bumpPattern(map, QBY[id], state.doneCore[id]));
  } else if (state.tab === 'revision' && schedule && !schedule.error) {
    schedule.revisions.forEach(r => bumpPattern(map, QBY[r.qid], state.doneRev[r.id]));
  } else if (state.tab === 'today' && schedule && !schedule.error) {
    const today = todayISO();
    const day = schedule.dayMap[today];
    (day ? day.newIds : []).forEach(id => bumpPattern(map, QBY[id], state.doneQ[id]));
    (schedule.revByDue[today] || []).forEach(r => bumpPattern(map, QBY[r.qid], state.doneRev[r.id]));
    (day ? day.coreIds : []).forEach(id => bumpPattern(map, QBY[id], state.doneCore[id]));
    DATA.questions.forEach(q => {
      const a = schedule.assigned[q.id];
      if (a && a < today && !state.doneQ[q.id]) bumpPattern(map, q, false);
    });
    schedule.revisions.forEach(r => {
      if (r.dueIso < today && !state.doneRev[r.id]) bumpPattern(map, QBY[r.qid], false);
    });
  } else {
    DATA.questions.forEach(q => bumpPattern(map, q, state.doneQ[q.id]));
  }
  return map;
}

function tabPatternLabel() {
  return ({
    today: 'Today', phase1: 'Phase 1', phase2: 'Phase 2', both: 'Phase 1 + 2',
    revision: 'Revision', core: 'Core 200', settings: 'All questions',
  })[state.tab] || 'Patterns';
}

function renderSidebar() {
  const counts = patternCounts();
  const html = [`<div class="side-head"><h3>${esc(tabPatternLabel())}</h3><button class="icon-btn" id="clearPat" type="button" style="padding:.15rem .4rem;font-size:.7rem">Clear</button><button type="button" class="side-corner" id="sideCollapse" title="Hide sidebar" aria-label="Hide sidebar">‹</button></div>`];
  let n = 0;
  DATA.patterns.forEach(p => {
    const c = counts[p.key];
    if (!c.total) return;
    n++;
    const active = state.patternFilter === p.key ? 'active' : '';
    html.push(`<button type="button" class="pat ${active}" data-pat="${esc(p.key)}"><span class="n"><span class="idx">${n}</span><span class="nm">${esc(p.name)}</span></span><span class="c">${c.done}/${c.total}</span></button>`);
  });
  if (!n) html.push('<div class="empty">No patterns in this tab.</div>');
  $('#sidebar').innerHTML = html.join('');
  $$('.pat', $('#sidebar')).forEach(btn => {
    btn.addEventListener('click', () => {
      const k = btn.getAttribute('data-pat');
      state.patternFilter = state.patternFilter === k ? null : k;
      if (state.patternFilter) state.openAcc[state.tab + ':' + k] = true;
      saveState();
      $$('.pat', $('#sidebar')).forEach(b => b.classList.toggle('active', b.getAttribute('data-pat') === state.patternFilter));
      renderContentOnly();
      const acc = document.querySelector('.accordion[data-pat="' + CSS.escape(k) + '"]');
      if (acc) acc.scrollIntoView({ behavior: 'smooth', block: 'start' });
    });
  });
  const clr = $('#clearPat');
  if (clr) clr.addEventListener('click', (e) => {
    e.stopPropagation();
    state.patternFilter = null; saveState();
    $$('.pat', $('#sidebar')).forEach(b => b.classList.remove('active'));
    renderContentOnly();
  });
  const hide = $('#sideCollapse');
  if (hide) hide.addEventListener('click', toggleSidebar);
}

const TABS = [
  ['today', 'Today'],
  ['phase1', 'Phase 1'],
  ['phase2', 'Phase 2'],
  ['both', 'Phase 1 + 2'],
  ['revision', 'Revision'],
  ['core', 'Core 200'],
  ['settings', 'Settings'],
];

function renderTabs() {
  $('#tabs').innerHTML = TABS.map(([id, label]) =>
    `<button type="button" class="tab ${state.tab===id?'active':''}" data-tab="${id}">${label}</button>`
  ).join('');
  $$('.tab').forEach(b => b.addEventListener('click', () => {
    state.tab = b.getAttribute('data-tab');
    saveState();
    $$('.tab').forEach(t => t.classList.toggle('active', t === b));
    renderSidebar();
    renderContentOnly();
  }));
}

function renderToolbar() {
  if (state.tab === 'settings') {
    $('#toolbar').innerHTML = '';
    return;
  }
  $('#toolbar').innerHTML = `
    <input type="search" id="searchBox" placeholder="Search questions, companies…" value="${esc(state.search)}">
    <select id="doneFilter">
      <option value="all"${state.doneFilter==='all'?' selected':''}>All</option>
      <option value="undone"${state.doneFilter==='undone'?' selected':''}>Undone</option>
      <option value="done"${state.doneFilter==='done'?' selected':''}>Done</option>
    </select>
  `;
  $('#searchBox').addEventListener('input', (e) => {
    state.search = e.target.value;
    renderContentOnly();
  });
  $('#searchBox').addEventListener('change', () => saveState());
  $('#doneFilter').addEventListener('change', (e) => {
    state.doneFilter = e.target.value;
    saveState(); renderContentOnly();
  });
}

function matchFilters(q, isDone) {
  if (state.patternFilter && q.patternKey !== state.patternFilter) return false;
  if (state.doneFilter === 'done' && !isDone) return false;
  if (state.doneFilter === 'undone' && isDone) return false;
  if (state.search && state.search.trim()) {
    const s = state.search.trim().toLowerCase();
    const hay = (q.name + ' ' + (q.key || '') + ' ' + (q.id || '') + ' ' + (q.companies||[]).join(' ') + ' ' + q.pattern).toLowerCase();
    if (!hay.includes(s)) return false;
  }
  return true;
}

function qRow(q, opts) {
  const {
    checked, onAttr, badgeHtml = '', kind = 'q'
  } = opts;
  const comps = (q.companies || []).slice(0,5).join(', ');
  const open = q.url
    ? `<a class="open-link" href="${esc(q.url)}" target="_blank" rel="noopener noreferrer">Open</a>`
    : `<span class="open-link disabled">No link</span>`;
  return `<div class="row ${checked?'done':''}" data-kind="${esc(kind)}" data-id="${esc(onAttr)}">
    <input type="checkbox" ${checked?'checked':''} aria-label="Done">
    <div>
      <div class="qname">${esc(q.name)}</div>
      <div class="qmeta">
        <span class="chip">${esc(q.pattern)}</span>
        <span class="chip phase">Phase ${q.phase}</span>
        ${badgeHtml}
      </div>
    </div>
    ${open}
    <div class="companies">${esc(comps)}</div>
  </div>`;
}

function section(title, rowsHtml, count) {
  if (!rowsHtml) return `<div class="section"><h2>${esc(title)} <span class="badge">0</span></h2><div class="empty">Nothing here.</div></div>`;
  return `<div class="section"><h2>${esc(title)} <span class="badge">${count}</span></h2>${rowsHtml}</div>`;
}

function todayISO() {
  // Use local today; for testing allow override via ?date=YYYY-MM-DD
  const params = new URLSearchParams(location.search);
  if (params.get('date')) return params.get('date');
  return fmtISO(new Date());
}

function renderToday() {
  if (schedule.error) return `<div class="section"><div class="empty">${esc(schedule.error)}</div></div>`;
  const today = todayISO();
  const day = schedule.dayMap[today];
  const newIds = day ? day.newIds : [];
  const coreIds = day ? day.coreIds : [];
  const dueRevs = (schedule.revByDue[today] || []).slice();
  // Overdue: revisions due before today and not done; new questions assigned before today and not done
  const overdueRevs = schedule.revisions.filter(r => r.dueIso < today && !state.doneRev[r.id]);
  const overdueNew = DATA.questions.filter(q => {
    const a = schedule.assigned[q.id];
    return a && a < today && !state.doneQ[q.id];
  });

  let html = '';
  // New today
  let rows = newIds.map(id => QBY[id]).filter(q => matchFilters(q, !!state.doneQ[q.id]))
    .map(q => qRow(q, { checked: !!state.doneQ[q.id], onAttr: q.id, kind:'q',
      badgeHtml: `<span class="chip">New · ${esc(today)}</span>` })).join('');
  html += section("Today's new questions", rows, newIds.filter(id => matchFilters(QBY[id], !!state.doneQ[id])).length);

  // Due revisions today
  rows = dueRevs.map(r => {
    const q = QBY[r.qid];
    if (!matchFilters(q, !!state.doneRev[r.id])) return '';
    return qRow(q, {
      checked: !!state.doneRev[r.id], onAttr: r.id, kind:'rev',
      badgeHtml: `<span class="chip rev">D+${r.offset}${r.clamped?' · clamped':''}</span>`
    });
  }).filter(Boolean).join('');
  html += section("Revisions due today", rows, dueRevs.filter(r => matchFilters(QBY[r.qid], !!state.doneRev[r.id])).length);

  if (coreIds.length) {
    rows = coreIds.map(id => QBY[id]).filter(q => matchFilters(q, !!state.doneCore[q.id]))
      .map(q => qRow(q, { checked: !!state.doneCore[q.id], onAttr: q.id, kind:'core',
        badgeHtml: `<span class="chip">Core 200</span>` })).join('');
    html += section("Core 200 today", rows, coreIds.filter(id => matchFilters(QBY[id], !!state.doneCore[id])).length);
  }

  rows = overdueNew.filter(q => matchFilters(q, false))
    .sort((a,b)=>schedule.assigned[a.id] < schedule.assigned[b.id] ? -1 : 1)
    .map(q => qRow(q, { checked:false, onAttr:q.id, kind:'q',
      badgeHtml: `<span class="chip over">Overdue · assigned ${esc(schedule.assigned[q.id])}</span>` })).join('');
  html += section('Overdue new questions', rows, overdueNew.filter(q => matchFilters(q, false)).length);

  rows = overdueRevs.filter(r => matchFilters(QBY[r.qid], false))
    .sort((a,b)=>a.dueIso < b.dueIso ? -1 : 1)
    .map(r => qRow(QBY[r.qid], { checked:false, onAttr:r.id, kind:'rev',
      badgeHtml: `<span class="chip over">Overdue D+${r.offset} · due ${esc(r.dueIso)}</span>` })).join('');
  html += section('Overdue revisions', rows, overdueRevs.filter(r => matchFilters(QBY[r.qid], false)).length);

  const phaseLabel = day ? (day.phase===1?'Phase 1':day.phase===2?'Phase 2':day.phase===3?'Revision buffer':'Core 200') : 'Outside schedule';
  $('#metaLine').textContent = `Today ${today} · ${phaseLabel}` + (day ? ` · ${day.nNew} new` + (day.nCore?` · ${day.nCore} core`:'') : '');
  return html;
}

function inclusiveDays(startIso, endIso) {
  if (!startIso || !endIso) return 0;
  const n = daysBetween(parseISO(startIso), parseISO(endIso));
  return n > 0 ? n : 0;
}
function windowFor(ids, isoOf) {
  const isos = ids.map(isoOf).filter(Boolean).sort();
  if (!isos.length) return null;
  const start = isos[0];
  const end = isos[isos.length - 1];
  return { start, end, days: inclusiveDays(start, end) };
}
function dateBarHtml() {
  const s = state.settings;
  const p1Days = inclusiveDays(s.startDate, s.phase1End);
  const p2Start = fmtISO(addDays(parseISO(s.phase1End), 1));
  const p2Days = inclusiveDays(p2Start, s.phase2End);
  const showP1 = state.tab === 'phase1' || state.tab === 'both';
  const showP2 = state.tab === 'phase2' || state.tab === 'both';
  return `<div class="date-bar">
    ${showP1 ? `<label><b>Phase 1 start</b><input type="date" id="liveStart" value="${esc(s.startDate)}"></label>
    <label><b>Phase 1 end</b><input type="date" id="liveP1" value="${esc(s.phase1End)}"></label>
    <span class="days-pill">Phase 1 · ${p1Days} days</span>` : ''}
    ${showP2 ? `<label><b>Phase 2 start</b><input type="date" id="liveP2Start" value="${esc(p2Start)}" title="Day after Phase 1 ends"></label>
    <label><b>Phase 2 end</b><input type="date" id="liveP2" value="${esc(s.phase2End)}"></label>
    <span class="days-pill">Phase 2 · ${p2Days} days</span>` : ''}
    ${state.tab === 'both' ? `<span class="days-pill">Together · ${p1Days + p2Days} days</span>` : ''}
  </div>`;
}
function bindDateBar() {
  const apply = (e) => {
    const id = e.target.id;
    const value = e.target.value;
    if (!value) return;
    if (id === 'liveStart') state.settings.startDate = value;
    if (id === 'liveP1') state.settings.phase1End = value;
    if (id === 'liveP2') state.settings.phase2End = value;
    if (id === 'liveP2Start') state.settings.phase1End = fmtISO(addDays(parseISO(value), -1));
    saveState();
    recompute();
    render();
  };
  ['#liveStart', '#liveP1', '#liveP2', '#liveP2Start'].forEach(sel => {
    const el = $(sel);
    if (el) el.addEventListener('change', apply);
  });
}
function isOpen(key, fallback) {
  if (state.openAcc[key] === true) return true;
  if (state.openAcc[key] === false) return false;
  return !!fallback;
}
function searchActive() {
  return !!(state.search && state.search.trim());
}
function accordionBlock(accKey, patternKey, title, range, rowsHtml, mark, phase) {
  const open = (searchActive() || isOpen(accKey, false)) ? ' open' : '';
  const pct = mark.total ? Math.round(100 * mark.done / mark.total) : 0;
  const rangeText = range
    ? `${range.start} → ${range.end}<br>${range.days} day${range.days===1?'':'s'}`
    : 'Set dates to see the range';
  const checked = mark.total && mark.done === mark.total ? 'checked' : '';
  return `<details class="accordion" data-acc="${esc(accKey)}" data-pat="${esc(patternKey)}" data-phase="${phase}"${open}>
    <summary>
      <label class="acc-check" title="Mark every question in this pattern"><input type="checkbox" data-mark="1" ${checked}></label>
      <span class="chev" aria-hidden="true"></span>
      <span class="acc-name">${esc(title)}<span class="acc-sub">${mark.done}/${mark.total} done</span></span>
      <span class="acc-range">${rangeText}</span>
      <span class="mini" title="${pct}%"><i style="width:${pct}%"></i></span>
    </summary>
    ${rowsHtml || '<div class="empty">Nothing in this pattern for the current filter.</div>'}
  </details>`;
}
function renderQuestionAccordions(questions, phase) {
  const groups = new Map();
  DATA.patterns.forEach(p => groups.set(p.key, []));
  questions.forEach(q => {
    if (!groups.has(q.patternKey)) groups.set(q.patternKey, []);
    groups.get(q.patternKey).push(q);
  });
  let html = '';
  let shown = 0;
  DATA.patterns.forEach(p => {
    const all = (groups.get(p.key) || []).sort((a,b) => a.order - b.order || a.phase - b.phase);
    const visible = all.filter(q => matchFilters(q, !!state.doneQ[q.id]));
    if (!visible.length) return;
    shown += visible.length;
    const win = windowFor(all.map(q => q.id), id => schedule && schedule.assigned && schedule.assigned[id]);
    const rows = visible.map(q => {
      const a = schedule && schedule.assigned[q.id];
      return qRow(q, { checked: !!state.doneQ[q.id], onAttr: q.id, kind: 'q',
        badgeHtml: a ? `<span class="chip">${esc(a)}</span>` : '' });
    }).join('');
    const done = all.filter(q => state.doneQ[q.id]).length;
    const key = 'p' + phase + ':' + p.key;
    html += accordionBlock(key, p.key, p.name, win, rows, { done, total: all.length }, phase);
  });
  return { html, shown };
}
function phaseWindow(ph) {
  const s = state.settings;
  if (ph === 1) return { start: s.startDate, end: s.phase1End, days: inclusiveDays(s.startDate, s.phase1End) };
  const start = fmtISO(addDays(parseISO(s.phase1End), 1));
  return { start, end: s.phase2End, days: inclusiveDays(start, s.phase2End) };
}
function renderPhaseGroup(ph) {
  const all = DATA.questions.filter(q => q.phase === ph);
  const { html, shown } = renderQuestionAccordions(all, ph);
  const win = phaseWindow(ph);
  const done = all.filter(q => state.doneQ[q.id]).length;
  const pct = all.length ? Math.round(100 * done / all.length) : 0;
  const key = 'phase:' + ph;
  const open = (searchActive() || (shown > 0 && isOpen(key, true))) ? ' open' : '';
  const checked = all.length && done === all.length ? 'checked' : '';
  const anyClosed = DATA.patterns.some(p => all.some(q => q.patternKey === p.key) && !isOpen('p' + ph + ':' + p.key, false));
  return `<details class="phase-acc phase-${ph}" data-acc="${key}" data-phase="${ph}"${open}>
    <summary>
      <label class="acc-check" title="Mark every question in Phase ${ph}"><input type="checkbox" data-mark-phase="${ph}" ${checked}></label>
      <span class="chev" aria-hidden="true"></span>
      <span class="acc-name">Phase ${ph}<span class="acc-sub">${shown} shown · ${all.length} questions · ${win.days} days</span></span>
      <span class="acc-range">${esc(win.start)} → ${esc(win.end)}</span>
      <span class="mini" title="${pct}%"><i style="width:${pct}%"></i></span>
    </summary>
    <div class="phase-body">
      <div class="phase-tools"><button type="button" class="text-btn" data-phase-patterns="${ph}">${anyClosed ? 'Expand patterns' : 'Collapse patterns'}</button></div>
      ${html || '<div class="empty">Nothing in this phase for the current filter.</div>'}
    </div>
  </details>`;
}
function renderPhase(ph) {
  if (schedule && schedule.error) {
    $('#metaLine').textContent = schedule.error;
    return dateBarHtml() + `<div class="section"><div class="empty">${esc(schedule.error)}</div></div>`;
  }
  const all = DATA.questions.filter(q => q.phase === ph);
  const days = phaseWindow(ph).days;
  const shown = all.filter(q => matchFilters(q, !!state.doneQ[q.id])).length;
  $('#metaLine').textContent = `Phase ${ph}: ${shown} shown · ${all.length} questions · ${days} days on your dates`;
  return dateBarHtml() + renderPhaseGroup(ph);
}
function renderBoth() {
  if (schedule && schedule.error) {
    $('#metaLine').textContent = schedule.error;
    return dateBarHtml() + `<div class="section"><div class="empty">${esc(schedule.error)}</div></div>`;
  }
  const shown = DATA.questions.filter(q => matchFilters(q, !!state.doneQ[q.id])).length;
  const days = phaseWindow(1).days + phaseWindow(2).days;
  $('#metaLine').textContent = `Phase 1 + Phase 2: ${shown} shown · ${DATA.questions.length} questions · ${days} days`;
  return dateBarHtml() + renderPhaseGroup(1) + renderPhaseGroup(2);
}

function renderRevisionTab() {
  if (schedule.error) return `<div class="section"><div class="empty">${esc(schedule.error)}</div></div>`;
  const list = schedule.revisions
    .filter(r => matchFilters(QBY[r.qid], !!state.doneRev[r.id]))
    .sort((a,b)=> a.dueIso < b.dueIso ? -1 : a.dueIso > b.dueIso ? 1 : a.offset - b.offset);
  // virtualize-ish: still render all 3148 — acceptable for local file
  const rows = list.map(r => qRow(QBY[r.qid], {
    checked: !!state.doneRev[r.id], onAttr: r.id, kind:'rev',
    badgeHtml: `<span class="chip rev">D+${r.offset}</span><span class="chip">${esc(r.dueIso)}</span>${r.clamped?'<span class="chip over">clamped</span>':''}`
  })).join('');
  $('#metaLine').textContent = `Revisions: ${list.length} shown · ${schedule.revisions.length} total (expect 3148)`;
  return section('All revisions', rows, list.length);
}

function renderCoreTab() {
  const list = DATA.core200.map(id => QBY[id]).filter(q => matchFilters(q, !!state.doneCore[q.id]));
  const rows = list.map(q => qRow(q, {
    checked: !!state.doneCore[q.id], onAttr:q.id, kind:'core',
    badgeHtml: `<span class="chip">Core 200</span>`
  })).join('');
  $('#metaLine').textContent = `Core 200: ${list.length} shown · ${DATA.core200.length} total`;
  return section('Core 200', rows, list.length);
}

function renderSettings() {
  const s = state.settings;
  const r = schedule && schedule.rates;
  const err = schedule && schedule.error;
  $('#metaLine').textContent = 'Adjust dates to rebuild the schedule. Counts of questions / revisions / core stay fixed.';
  const rateText = err ? err : (
`Phase 1: ${r.phase1.questions} Q over ${r.phase1.days} days → weekday ≈ ${r.phase1.weekdayAvg}/day, weekend ≈ ${r.phase1.weekendAvg}/day (min ${r.phase1.min}, max ${r.phase1.max})
Phase 2: ${r.phase2.questions} Q over ${r.phase2.days} days → weekday ≈ ${r.phase2.weekdayAvg}/day, weekend ≈ ${r.phase2.weekendAvg}/day (min ${r.phase2.min}, max ${r.phase2.max})
Revision buffer: ${r.revisionDays} days · revisions generated: ${r.revisions}
Core 200: ${r.core.questions} Q over ${r.core.days} days → weekday ≈ ${r.core.weekdayAvg}/day, weekend ≈ ${r.core.weekendAvg}/day (min ${r.core.min}, max ${r.core.max})
Range: ${r.range.start} → P1 ${r.range.phase1End} → P2 ${r.range.phase2End} → rev ${r.range.revStart || '—'}…${r.range.revEnd || '—'} → core ${r.range.coreStart}…${r.range.coreEnd}`
  );
  return `

      <label><b>Phase 2 end date</b><input type="date" id="setP2" value="${esc(s.phase2End)}"></label>
      <label><b>Revision-only days</b><input type="number" id="setRevN" min="0" max="120" value="${esc(s.revisionDays)}"></label>
      <label><b>Core 200 window (days)</b><input type="number" id="setCoreN" min="1" max="120" value="${esc(s.coreDays)}"></label>
      <button class="btn primary" type="button" id="btnApplyDates">Apply & recompute</button>

      <h3 style="margin:1rem 0 .4rem;font-size:.9rem">Computed per-day rate</h3>
      <div class="rate-box" id="rateBox">${esc(rateText)}</div>
      <p style="color:var(--muted);font-size:.8rem;margin:.6rem 0 0">Invariant checks: questions=${DATA.questions.length}, revisions should be ${DATA.questions.length * REV_OFFSETS.length}, core=${DATA.core200.length}. Actual revisions=${schedule && !schedule.error ? schedule.revisions.length : '—'}</p>
    </div>
    <div class="card">

      <button class="btn danger" type="button" id="btnReset" style="margin-top:.5rem">Reset all progress…</button>

function bindSettings() {
  const apply = () => {
    state.settings.startDate = $('#setStart').value;
    state.settings.phase1End = $('#setP1').value;
    state.settings.phase2End = $('#setP2').value;
    state.settings.revisionDays = Number($('#setRevN').value);
    state.settings.coreDays = Number($('#setCoreN').value);
    saveState();
    recompute();
    render();
  };
  $('#btnApplyDates')?.addEventListener('click', apply);
  $('#btnResetDates')?.addEventListener('click', () => {
    state.settings = defaultSettings();
    saveState(); recompute(); render();
  });
  $('#btnExport')?.addEventListener('click', () => {
    const blob = new Blob([JSON.stringify({
      version: 8,
      exportedAt: new Date().toISOString(),
      settings: state.settings,
      doneQ: state.doneQ,
      doneRev: state.doneRev,
      doneCore: state.doneCore,
    }, null, 2)], { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'dsa-tracker-progress.json';
    a.click();
    URL.revokeObjectURL(a.href);
  });
  $('#importFile')?.addEventListener('change', async (e) => {
    const f = e.target.files && e.target.files[0];
    if (!f) return;
    try {
      const obj = JSON.parse(await f.text());
      if (obj.settings) state.settings = { ...defaultSettings(), ...obj.settings };
      if (obj.doneQ) state.doneQ = obj.doneQ;
      if (obj.doneRev) state.doneRev = obj.doneRev;
      if (obj.doneCore) state.doneCore = obj.doneCore;
      saveState(); recompute(); render();
    } catch (err) {
      alert('Import failed: ' + err.message);
    }
  });
  $('#btnReset')?.addEventListener('click', () => {
    if (!confirm('Reset all progress (checkboxes)? Schedule settings are kept.')) return;
    state.doneQ = {};
    state.doneRev = {};
    state.doneCore = {};
    saveState(); render();
  });
}

function bagFor(kind) {
  if (kind === 'rev') return state.doneRev;
  if (kind === 'core') return state.doneCore;
  return state.doneQ;
}
function bindRows() {
  $$('#content .row').forEach(row => {
    const kind = row.getAttribute('data-kind');
    const id = row.getAttribute('data-id');
    const cb = $('input[type=checkbox]', row);
    cb.addEventListener('change', () => {
      const bag = bagFor(kind);
      if (cb.checked) bag[id] = true; else delete bag[id];
      saveState();
      row.classList.toggle('done', cb.checked);
      const acc = row.closest('.accordion');
      if (acc) syncAccCheckbox(acc);
      renderProgress();
      patchSidebarCounts();
    });
  });
}
function patchSidebarCounts() {
  const counts = patternCounts();
  const buttons = $$('.pat', $('#sidebar'));
  if (!buttons.length) return;
  let restamp = false;
  buttons.forEach(btn => {
    const c = counts[btn.getAttribute('data-pat')];
    const el = $('.c', btn);
    if (!c || !c.total || !el) { restamp = true; return; }
    el.textContent = c.done + '/' + c.total;
  });
  if (restamp) renderSidebar();
}
function paintQuestion(id, checked) {
  const row = document.querySelector('.row[data-kind="q"][data-id="' + CSS.escape(id) + '"]');
  if (!row) return;
  row.classList.toggle('done', checked);
  const box = $('input[type=checkbox]', row);
  if (box) box.checked = checked;
}
function patternQuestions(patternKey, phase) {
  return DATA.questions.filter(q => q.patternKey === patternKey && (!phase || q.phase === Number(phase)));
}
function syncAccCheckbox(acc) {
  const cb = $('input[data-mark]', acc);
  if (!cb) return;
  const qs = patternQuestions(acc.getAttribute('data-pat'), acc.getAttribute('data-phase'));
  const done = qs.filter(q => state.doneQ[q.id]).length;
  cb.checked = qs.length > 0 && done === qs.length;
  cb.indeterminate = done > 0 && done < qs.length;
}
function syncPhaseCheckbox(acc) {
  const cb = $('input[data-mark-phase]', acc);
  if (!cb) return;
  const ph = Number(cb.getAttribute('data-mark-phase'));
  const qs = DATA.questions.filter(q => q.phase === ph);
  const done = qs.filter(q => state.doneQ[q.id]).length;
  cb.checked = qs.length > 0 && done === qs.length;
  cb.indeterminate = done > 0 && done < qs.length;
}
function bindAccordions() {
  $$('#content .accordion, #content .phase-acc').forEach(acc => {
    acc.addEventListener('toggle', () => {
      if (ignoreAccToggle || searchActive()) return;
      const key = acc.getAttribute('data-acc');
      if (!key || state.openAcc[key] === acc.open) return;
      if (state.openAcc[key] === undefined && acc.open === isOpen(key, key.indexOf('phase:') === 0)) return;
      state.openAcc[key] = acc.open;
      saveState();
    });
  });
  $$('#content .accordion').forEach(acc => {
    syncAccCheckbox(acc);
    const cb = $('input[data-mark]', acc);
    if (!cb) return;
    cb.addEventListener('click', (e) => e.stopPropagation());
    cb.addEventListener('change', () => {
      patternQuestions(acc.getAttribute('data-pat'), acc.getAttribute('data-phase')).forEach(q => {
        if (cb.checked) state.doneQ[q.id] = true;
        else delete state.doneQ[q.id];
      });
      cb.indeterminate = false;
      patternQuestions(acc.getAttribute('data-pat'), acc.getAttribute('data-phase')).forEach(q => paintQuestion(q.id, cb.checked));
      const phase = acc.closest('.phase-acc');
      if (phase) syncPhaseCheckbox(phase);
      saveState();
      renderProgress();
      patchSidebarCounts();
    });
  });
  $$('#content .phase-acc').forEach(acc => {
    syncPhaseCheckbox(acc);
    const cb = $('input[data-mark-phase]', acc);
    if (cb) {
      cb.addEventListener('click', (e) => e.stopPropagation());
      cb.addEventListener('change', () => {
        const ph = Number(cb.getAttribute('data-mark-phase'));
        DATA.questions.filter(q => q.phase === ph).forEach(q => {
          if (cb.checked) state.doneQ[q.id] = true;
          else delete state.doneQ[q.id];
          paintQuestion(q.id, cb.checked);
        });
        cb.indeterminate = false;
        $$('.accordion', acc).forEach(syncAccCheckbox);
        saveState();
        renderProgress();
        patchSidebarCounts();
      });
    }
    const toggle = $('[data-phase-patterns]', acc);
    if (toggle) toggle.addEventListener('click', (e) => {
      e.preventDefault();
      e.stopPropagation();
      const boxes = $$('.accordion', acc);
      const expand = boxes.some(d => !d.open);
      ignoreAccToggle = true;
      boxes.forEach(d => {
        d.open = expand;
        state.openAcc[d.getAttribute('data-acc')] = expand;
      });
      toggle.textContent = expand ? 'Collapse patterns' : 'Expand patterns';
      saveState();
      setTimeout(() => { ignoreAccToggle = false; }, 0);
    });
  });
}

function renderContentOnly() {
  const root = $('#content');
  let html = '';
  if (state.tab === 'today') html = renderToday();
  else if (state.tab === 'phase1') html = renderPhase(1);
  else if (state.tab === 'phase2') html = renderPhase(2);
  else if (state.tab === 'both') html = renderBoth();
  else if (state.tab === 'revision') html = renderRevisionTab();
  else if (state.tab === 'core') html = renderCoreTab();
  else if (state.tab === 'settings') html = renderSettings();
  ignoreAccToggle = true;
  root.innerHTML = html;
  if (!root.classList.contains('is-in')) root.classList.add('is-in');
  if (state.tab === 'settings') bindSettings();
  else {
    bindRows();
    bindDateBar();
    bindAccordions();
  }
  setTimeout(() => { ignoreAccToggle = false; }, 0);
}

function sidebarIsOpen() {
  const narrow = window.matchMedia('(max-width: 960px)').matches;
  if (narrow) return $('#sidebar').classList.contains('open');
  return state.sidebarOpen !== false;
}
function applySidebar() {
  const narrow = window.matchMedia('(max-width: 960px)').matches;
  const app = $('.app');
  const side = $('#sidebar');
  if (narrow) app.classList.remove('sidebar-collapsed');
  else {
    side.classList.remove('open');
    app.classList.toggle('sidebar-collapsed', state.sidebarOpen === false);
  }
  $('#sideExpand').classList.toggle('is-on', !sidebarIsOpen());
}
function toggleSidebar() {
  const narrow = window.matchMedia('(max-width: 960px)').matches;
  if (narrow) $('#sidebar').classList.toggle('open');
  else state.sidebarOpen = state.sidebarOpen === false;
  saveState();
  applySidebar();
}
let toastTimer = null;
let offlineNoted = false;
function hideToast() {
  const el = $('#toast');
  if (el) el.classList.remove('is-on');
}
function showToast(message, kind) {
  const el = $('#toast');
  if (!el || !message) return;
  $('#toastText').textContent = message;
  el.className = 'toast is-on ' + (kind === 'ok' ? 'ok' : 'err');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(hideToast, 3400);
}
function renderWho() {
  const who = $('#who');
  const btn = $('#btnAccount');
  if (session && session.id) {
    who.textContent = session.id;
    who.title = 'Saved as users/' + session.id + '.json';
    btn.textContent = 'Sign out';
  } else {
    who.textContent = '';
    btn.textContent = 'Sign in';
  }
}
function render() {
  applyTheme();
  renderWho();
  renderProgress();
  renderSidebar();
  renderTabs();
  renderToolbar();
  renderContentOnly();
  applySidebar();
}

let session = null;
try { session = JSON.parse(localStorage.getItem(SESSION_KEY) || 'null'); } catch (e) { session = null; }
let syncTimer = null;
function userId(mobile, name) {
  const m = String(mobile || '').replace(/\D/g, '');
  const n = String(name || '').trim().replace(/[^A-Za-z0-9]+/g, '_').replace(/^_|_$/g, '').slice(0, 40);
  if (!/^[0-9]{8,15}$/.test(m) || !n) return '';
  return m + '_' + n;
}
async function sha256(text) {
  const bytes = new TextEncoder().encode(text);
  if (crypto.subtle) {
    const buf = await crypto.subtle.digest('SHA-256', bytes);
    return [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2, '0')).join('');
  }
  return fallbackSha256(bytes);
}
function fallbackSha256(bytes) {
  const K = new Uint32Array([
    0x428a2f98,0x71374491,0xb5c0fbcf,0xe9b5dba5,0x3956c25b,0x59f111f1,0x923f82a4,0xab1c5ed5,
    0xd807aa98,0x12835b01,0x243185be,0x550c7dc3,0x72be5d74,0x80deb1fe,0x9bdc06a7,0xc19bf174,
    0xe49b69c1,0xefbe4786,0x0fc19dc6,0x240ca1cc,0x2de92c6f,0x4a7484aa,0x5cb0a9dc,0x76f988da,
    0x983e5152,0xa831c66d,0xb00327c8,0xbf597fc7,0xc6e00bf3,0xd5a79147,0x06ca6351,0x14292967,
    0x27b70a85,0x2e1b2138,0x4d2c6dfc,0x53380d13,0x650a7354,0x766a0abb,0x81c2c92e,0x92722c85,
    0xa2bfe8a1,0xa81a664b,0xc24b8b70,0xc76c51a3,0xd192e819,0xd6990624,0xf40e3585,0x106aa070,
    0x19a4c116,0x1e376c08,0x2748774c,0x34b0bcb5,0x391c0cb3,0x4ed8aa4a,0x5b9cca4f,0x682e6ff3,
    0x748f82ee,0x78a5636f,0x84c87814,0x8cc70208,0x90befffa,0xa4506ceb,0xbef9a3f7,0xc67178f2
  ]);
  const rotr = (x, n) => (x >>> n) | (x << (32 - n));
  const len = bytes.length;
  const bitLen = len * 8;
  const withPad = new Uint8Array(((len + 9 + 63) & ~63));
  withPad.set(bytes);
  withPad[len] = 0x80;
  const view = new DataView(withPad.buffer);
  view.setUint32(withPad.length - 4, bitLen >>> 0, false);
  let h0=0x6a09e667,h1=0xbb67ae85,h2=0x3c6ef372,h3=0xa54ff53a,h4=0x510e527f,h5=0x9b05688c,h6=0x1f83d9ab,h7=0x5be0cd19;
  const w = new Uint32Array(64);
  for (let i = 0; i < withPad.length; i += 64) {
    for (let t = 0; t < 16; t++) w[t] = view.getUint32(i + t * 4, false);
    for (let t = 16; t < 64; t++) {
      const s0 = rotr(w[t-15], 7) ^ rotr(w[t-15], 18) ^ (w[t-15] >>> 3);
      const s1 = rotr(w[t-2], 17) ^ rotr(w[t-2], 19) ^ (w[t-2] >>> 10);
      w[t] = (w[t-16] + s0 + w[t-7] + s1) >>> 0;
    }
    let a=h0,b=h1,c=h2,d=h3,e=h4,f=h5,g=h6,h=h7;
    for (let t = 0; t < 64; t++) {
      const S1 = rotr(e, 6) ^ rotr(e, 11) ^ rotr(e, 25);
      const ch = (e & f) ^ (~e & g);
      const t1 = (h + S1 + ch + K[t] + w[t]) >>> 0;
      const S0 = rotr(a, 2) ^ rotr(a, 13) ^ rotr(a, 22);
      const maj = (a & b) ^ (a & c) ^ (b & c);
      const t2 = (S0 + maj) >>> 0;
      h=g; g=f; f=e; e=(d + t1) >>> 0; d=c; c=b; b=a; a=(t1 + t2) >>> 0;
    }
    h0=(h0+a)>>>0; h1=(h1+b)>>>0; h2=(h2+c)>>>0; h3=(h3+d)>>>0;
    h4=(h4+e)>>>0; h5=(h5+f)>>>0; h6=(h6+g)>>>0; h7=(h7+h)>>>0;
  }
  return [h0,h1,h2,h3,h4,h5,h6,h7].map(x => x.toString(16).padStart(8,'0')).join('');
}
function progressPayload() {
  return {
    theme: state.theme,
    settings: state.settings,
    doneQ: state.doneQ,
    doneRev: state.doneRev,
    doneCore: state.doneCore,
    tab: state.tab,
    patternFilter: state.patternFilter,
    search: state.search,
    doneFilter: state.doneFilter,
    sidebarOpen: state.sidebarOpen !== false,
    openAcc: state.openAcc || {},
  };
}
function applyProgress(progress) {
  if (!progress || typeof progress !== 'object') return;
  state.theme = progress.theme || state.theme;
  state.settings = { ...defaultSettings(), ...(progress.settings || {}) };
  state.doneQ = progress.doneQ || {};
  state.doneRev = progress.doneRev || {};
  state.doneCore = progress.doneCore || {};
  state.tab = progress.tab || state.tab;
  state.patternFilter = progress.patternFilter || null;
  state.search = progress.search || '';
  state.doneFilter = progress.doneFilter || 'all';
  state.sidebarOpen = progress.sidebarOpen !== false;
  state.openAcc = progress.openAcc || {};
}
function localAccounts() {
  try { return JSON.parse(localStorage.getItem(ACCOUNTS_KEY) || '{}') || {}; } catch (e) { return {}; }
}
function writeLocalAccount(rec) {
  const all = localAccounts();
  all[rec.id] = rec;
  localStorage.setItem(ACCOUNTS_KEY, JSON.stringify(all));
}
async function api(path, opts) {
  if (!canReachSaveServer()) {
    serverOk = false;
    throw new Error('Save server is not running. Start it with node server.mjs, then open the address it prints');
  }
  let res;
  try {
    res = await fetch(API + path, {
      ...opts,
      headers: { 'Content-Type': 'application/json', ...(opts && opts.headers) },
    });
  } catch (e) {
    serverOk = false;
    throw new Error('Save server is not running. Start it with node server.mjs, then open the address it prints');
  }
  const data = await res.json().catch(() => ({}));
  if (!res.ok) {
    if (res.status === 404 && path === '/api/health') {
      serverOk = false;
      throw new Error('This page is not being served by the tracker. Open the address node server.mjs prints');
    }
    throw new Error(data.error || ('Request failed (' + res.status + ')'));
  }
  serverOk = true;
  return data;
}
function scheduleUserSync() {
  if (!session || !session.id || !session.token) return;
  if (progressSnapshot() !== lastSavedPayload) return;
  writeLocalAccount({
    id: session.id,
    mobile: session.mobile,
    name: session.name,
    passwordHash: session.passwordHash,
    token: session.token,
    updatedAt: new Date().toISOString(),
    progress: progressPayload(),
  });
  clearTimeout(syncTimer);
  if (serverOk === false) {
    if (!offlineNoted) {
      offlineNoted = true;
      showToast(location.protocol === 'https:'
        ? 'Saved in this browser.'
        : 'Saved in this browser. Start node server.mjs to write the users folder.', location.protocol === 'https:' ? 'ok' : 'err');
    }
    return;
  }
  offlineNoted = false;
  syncTimer = setTimeout(syncUser, 200);
}
async function syncUser() {
  if (!session || !session.id || !session.token) return;
  const rec = {
    id: session.id,
    mobile: session.mobile,
    name: session.name,
    passwordHash: session.passwordHash,
    token: session.token,
    updatedAt: new Date().toISOString(),
    progress: progressPayload(),
  };
  writeLocalAccount(rec);
  try {
    await api('/api/users/' + encodeURIComponent(session.id), {
      method: 'PUT',
      headers: { 'x-token': session.token },
      body: JSON.stringify({ progress: rec.progress, updatedAt: rec.updatedAt }),
    });
  } catch (e) {
    showToast(serverOk === false ? 'Saved in this browser. Save server is offline.' : e.message, 'err');
  }
}
async function restoreSession() {
  if (!session || !session.id || !session.token) return;
  const local = localAccounts()[session.id];
  if (local && local.progress) applyProgress(local.progress);
  try {
    const data = await api('/api/users/' + encodeURIComponent(session.id), {
      headers: { 'x-token': session.token },
    });
    if (data.progress) applyProgress(data.progress);
    session.passwordHash = data.passwordHash || session.passwordHash;
  } catch (e) { /* keep local progress */ }
}
function openAccount() {
  $('#accountModal').classList.remove('hidden');
  refreshSavedUsers();
}
function closeAccount() { $('#accountModal').classList.add('hidden'); }
async function refreshSavedUsers() {
  const box = $('#savedUsers');
  // only accounts used in this browser; the server does not list other people's accounts
  const list = Object.keys(localAccounts()).sort();
  box.innerHTML = list.length ? list.map(id => `<button type="button" class="btn" data-user="${esc(id)}">${esc(id)}</button>`).join('') : '<span class="empty-acc">No saved accounts yet.</span>';
  $$('[data-user]', box).forEach(btn => btn.addEventListener('click', () => {
    const id = btn.getAttribute('data-user');
    const i = id.indexOf('_');
    $('#accMobile').value = id.slice(0, i);
    $('#accName').value = id.slice(i + 1).replace(/_/g, ' ');
    $('#accPass').focus();
  }));
}
async function submitAccount(create) {
  const mobile = $('#accMobile').value.trim();
  const name = $('#accName').value.trim();
  const password = $('#accPass').value;
  const id = userId(mobile, name);
  if (!id) { showToast('Use 8–15 digits and a name.', 'err'); return; }
  const passwordHash = await sha256(id + ':' + password);
  const token = (crypto.randomUUID && crypto.randomUUID()) || (Date.now().toString(36) + Math.random().toString(36).slice(2));
  try {
    const data = await api(create ? '/api/register' : '/api/login', {
      method: 'POST',
      body: JSON.stringify({ id, mobile: mobile.replace(/\D/g, ''), name, passwordHash, token }),
    });
    session = { id, mobile: data.mobile || mobile, name: data.name || name, token: data.token || token, passwordHash };
    localStorage.setItem(SESSION_KEY, JSON.stringify(session));
    if (data.progress) applyProgress(data.progress);
    else if (create) {
      state.doneQ = {}; state.doneRev = {}; state.doneCore = {};
    }
    writeLocalAccount({ ...session, updatedAt: new Date().toISOString(), progress: progressPayload() });
    saveState();
    recompute();
    closeAccount();
    render();
    showToast(create ? 'Account created' : 'Signed in', 'ok');
  } catch (err) {
    if (String(err.message).includes('Failed to fetch') || String(err.message).includes('NetworkError') || String(err.message).includes('Save server')) {
      const accounts = localAccounts();
      if (create) {
        if (accounts[id]) { showToast('That account already exists on this browser.', 'err'); return; }
        state.doneQ = {}; state.doneRev = {}; state.doneCore = {};
      } else if (!accounts[id] || accounts[id].passwordHash !== passwordHash) {
        showToast('Sign-in failed. Start the local server with node server.mjs, or use an account created in this browser.', 'err');
        return;
      } else if (accounts[id].progress) applyProgress(accounts[id].progress);
      session = { id, mobile: mobile.replace(/\D/g, ''), name, token, passwordHash };
      localStorage.setItem(SESSION_KEY, JSON.stringify(session));
      writeLocalAccount({ ...session, updatedAt: new Date().toISOString(), progress: progressPayload() });
      saveState();
      recompute();
      closeAccount();
      render();
      showToast(create ? 'Account created on this browser' : 'Signed in on this browser', 'ok');
      return;
    }
    showToast(err.message, 'err');
  }
}

// Header buttons
$('#btnTheme').addEventListener('click', () => {
  state.theme = state.theme === 'dark' ? 'light' : 'dark';
  saveState(); applyTheme();
});
$('#sideExpand').addEventListener('click', toggleSidebar);
$('#btnAccount').addEventListener('click', () => {
  if (session && session.id) {
    session = null;
    localStorage.removeItem(SESSION_KEY);
    renderWho();
    return;
  }
  openAccount();
});
$('#btnCloseAccount').addEventListener('click', closeAccount);
$('#toastClose').addEventListener('click', hideToast);
function refreshFilePreview() {
  const id = userId($('#accMobile').value, $('#accName').value);
  $('#accFilePreview').textContent = id || 'mobile_name';
}
$('#accMobile').addEventListener('input', refreshFilePreview);
$('#accName').addEventListener('input', refreshFilePreview);
$('#accPassToggle').addEventListener('click', () => {
  const input = $('#accPass');
  const show = input.type === 'password';
  input.type = show ? 'text' : 'password';
  $('#accPassToggle').textContent = show ? 'Hide' : 'Show';
});
$('#accountModal').addEventListener('click', (e) => { if (e.target.id === 'accountModal') closeAccount(); });
$('#accountForm').addEventListener('submit', (e) => { e.preventDefault(); submitAccount(false); });
$('#btnRegister').addEventListener('click', () => submitAccount(true));
window.addEventListener('resize', applySidebar);

// Expose for tests
window.__DSA__ = {
  get state() { return state; },
  get schedule() { return schedule; },
  DATA,
  recompute,
  buildSchedule,
  progressStats,
  setSettings(s) { state.settings = { ...state.settings, ...s }; saveState(); recompute(); },
  counts() {
    return {
      questions: DATA.questions.length,
      revisions: schedule && !schedule.error ? schedule.revisions.length : null,
      core: DATA.core200.length,
      phase1: DATA.questions.filter(q=>q.phase===1).length,
      phase2: DATA.questions.filter(q=>q.phase===2).length,
    };
  }
};

async function boot() {
  await restoreSession();
  lastSavedPayload = progressSnapshot();
  if (canReachSaveServer()) {
    try { await api('/api/health'); }
    catch (e) { showToast(e.message, 'err'); }
  }
  recompute();
  render();
  const loader = $('#bootLoader');
  if (loader) loader.classList.add('is-done');
}
boot();
})();
